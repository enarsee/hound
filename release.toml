# cargo-release settings: `cargo release patch|minor` (dry run), then add
# `--execute`. One version for the workspace, one commit, one `vX.Y.Z` tag
# (set on the hound crate; hound-core is not tagged). Neither crate is
# published: both say `publish = false` in their manifests.
allow-branch = ["main"]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "chore: release v{{version}}"
tag-name = "v{{version}}"
tag-message = "hound v{{version}}"
