[package]
name = "hound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hound"
path = "src/main.rs"

[dependencies]
hound-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-segmentation.workspace = true
clap.workspace = true
# geteuid, for the token file ownership check.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# SetConsoleCtrlHandler, so the resumed agent alone receives Ctrl+C; process creation flags,
# so the background `hound enrich` is detached.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
# herdr's named pipe, connected the way herdr itself connects.
interprocess = "2.4"

[dev-dependencies]
tempfile.workspace = true
ureq.workspace = true
