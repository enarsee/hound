name: Release

# Every green push to main publishes vX.Y.Z; every green push to beta publishes
# vX.Y.Z-beta.N. semantic-release (.releaserc.json) picks the version from the
# commit messages, writes it with scripts/set-version, commits, tags and
# creates the GitHub release. A release on main is then merged back into beta.
#
# GitHub only runs workflow_run workflows from the default branch's copy of
# this file. Pushes made here with the built-in token start no workflows, so
# the release commit and the back-merge cannot trigger another release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, beta]

permissions:
  contents: write # release commit, tag, back-merge
  issues: write # semantic-release comments on released issues
  pull-requests: write # and on released pull requests

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    # Only after CI passed on a push (never a pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # semantic-release authenticates with GITHUB_TOKEN itself.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # scripts/set-version checks Cargo.lock with cargo.
      - name: Install toolchain
        run: rustup toolchain install

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      - name: Merge main back into beta
        if: github.event.workflow_run.head_branch == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          scripts/back-merge origin
